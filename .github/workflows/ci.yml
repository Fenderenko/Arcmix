# Every push: the build without warnings, the tests and the translations check.
# A tag v*: the release build is packed into Arcmix-<version>.zip and put into a draft release,
# which is published by hand after a look.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/apo

      # the audio-engine module is embedded into the app: it is built first
      - name: Build the module
        working-directory: rust/apo
        run: cargo build --release
        env:
          RUSTFLAGS: -D warnings

      - name: Build without warnings
        working-directory: rust
        run: cargo build
        env:
          RUSTFLAGS: -D warnings

      - name: Tests
        working-directory: rust
        run: cargo test --release

      - name: Translations
        run: python tools/check_i18n.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Release build
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: rust
        run: cargo build --release

      - name: Pack the zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/package.py

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Arcmix-*.zip
          draft: true
